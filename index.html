<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Pineda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ink:#16181a;--muted:#62676c;--panel:rgba(255,255,255,.92);--line:rgba(0,0,0,.08);--accent:#1f5fbf;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#dfe6ea;color:var(--ink);font:14px/1.4 var(--f);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.card{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.t{font-weight:600;letter-spacing:-.01em}
.s{font:500 11.5px var(--m);color:var(--muted);margin-top:2px}
.pad{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.pad button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px;color:var(--ink);cursor:pointer;touch-action:none;user-select:none}
.pad button{grid-row:2}
.pad button[data-k="f"]{grid-column:2;grid-row:1}
[hidden]{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:rgba(0,0,0,.05);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:500 13px var(--f);padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font:500 11.5px var(--m);color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.room{font:600 12px var(--f);color:var(--ink);background:rgba(255,255,255,.9);padding:3px 8px;border-radius:6px;text-align:center;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.room span{display:block;font:500 10.5px var(--m);color:var(--muted)}
.street{font:600 10.5px var(--f);letter-spacing:.06em;text-transform:uppercase;color:rgba(40,44,48,.55);white-space:nowrap}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:500 13px var(--m);color:var(--muted)}
</style>
</head>
<body>
<canvas id="c" aria-label="Vista 3D de la casa"></canvas>
<div id="labels"></div>
<div class="loading" id="loading">Cargando modelo…</div>
<div class="card">
  <div><div class="t">Arnau de Vilanova 1</div><div class="s">Pineda de Mar</div></div>
  <div class="seg" role="group" aria-label="Vista">
    <button id="vExt" aria-pressed="true">Exterior</button>
    <button id="vP1" aria-pressed="false">Planta 1</button>
    <button id="vWalk" aria-pressed="false">Pasear</button>
  </div>
</div>
<div class="hint" id="hint">Arrastra para girar · rueda para acercar</div>
<div class="pad" id="pad" hidden>
  <button data-k="f" aria-label="Avanzar">▲</button>
  <button data-k="l" aria-label="Girar a la izquierda">◀</button><button data-k="b" aria-label="Retroceder">▼</button><button data-k="r" aria-label="Girar a la derecha">▶</button>
</div>

<script type="importmap">

</script>
<script type="module">

{

}

// ---------- texturas procedurales ----------
const rnd = (a, b) => a + Math.random() * (b - a);

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const plaster = (base) => tex(256, 256, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '90,70,40'},${rnd(.02, .07)})`; g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 3), rnd(1, 3)); } });
const tileRoof = tex(256, 256, (g, w, h) => { g.fillStyle = '#a9553a'; g.fillRect(0, 0, w, h);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 3; r++) { const x = c * 64, y = r * 102 - (c % 2) * 30, base = `hsl(${rnd(10, 22)},${rnd(42, 55)}%,${rnd(38, 48)}%)`;
    const gr = g.createLinearGradient(x, 0, x + 64, 0); gr.addColorStop(0, 'rgba(60,20,10,.55)'); gr.addColorStop(.4, base); gr.addColorStop(.6, base); gr.addColorStop(1, 'rgba(60,20,10,.5)');
    g.fillStyle = gr; g.fillRect(x, y, 64, 110); g.fillStyle = 'rgba(40,15,8,.35)'; g.fillRect(x, y + 100, 64, 4); } });
const stone = tex(256, 128, (g, w, h) => { g.fillStyle = '#6a5d4f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { const cx = rnd(0, w), cy = rnd(0, h), r = rnd(10, 24); g.fillStyle = `hsl(${rnd(26, 40)},${rnd(16, 30)}%,${rnd(50, 70)}%)`;
    g.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + rnd(-.3, .3), rr = r * rnd(.7, 1.1); g.lineTo(cx + Math.cos(a) * rr * 1.4, cy + Math.sin(a) * rr * .8); } g.closePath(); g.fill(); } }, [2, 2]);
const garage = tex(64, 256, (g, w) => { for (let i = 0; i < 32; i++) { const y = i * 8; g.fillStyle = '#5d6266'; g.fillRect(0, y, w, 8); g.fillStyle = '#7d8388'; g.fillRect(0, y + 1, w, 3); g.fillStyle = '#41464a'; g.fillRect(0, y + 6, w, 2); } });
const check = tex(64, 64, g => { g.fillStyle = '#efe8df'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#b5463b'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32); }, [30, 3]);
const asphalt = tex(128, 128, (g, w, h) => { g.fillStyle = '#5a5c5e'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},.07)`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); } });
const terracotta = tex(128, 128, (g) => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = `hsl(${rnd(14, 22)},${rnd(45, 58)}%,${rnd(42, 52)}%)`; g.fillRect(i * 32, j * 32, 32, 32); }
  g.strokeStyle = 'rgba(235,225,210,.8)'; g.lineWidth = 2; for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(k * 32, 0); g.lineTo(k * 32, 128); g.stroke(); g.beginPath(); g.moveTo(0, k * 32); g.lineTo(128, k * 32); g.stroke(); } }, [0.8, 0.8]);
const lightTile = tex(128, 128, (g) => { g.fillStyle = '#e4ddd2'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(120,100,80,${rnd(.03, .08)})`; g.fillRect(rnd(0, 128), rnd(0, 128), 3, 3); }
  g.strokeStyle = 'rgba(160,150,140,.6)'; g.lineWidth = 1.5; for (let k = 0; k <= 2; k++) { g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64, 128); g.stroke(); g.beginPath(); g.moveTo(0, k * 64); g.lineTo(128, k * 64); g.stroke(); } }, [1.1, 1.1]);
const bathTile = tex(64, 64, (g) => { g.fillStyle = '#d7d9d6'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#b9bcb8'; g.lineWidth = 1.5; g.strokeRect(0, 0, 32, 32); g.strokeRect(32, 32, 32, 32); g.strokeRect(32, 0, 32, 32); g.strokeRect(0, 32, 32, 32); }, [2.5, 2.5]);

// alicatados: baldosa con junta, tamaño real (la UV va en metros)
function tiles(base, joint, cols, rows, vary = 4) { return tex(256, 256, (g, w, h) => { const cw = w / cols, ch = h / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { const l = parseInt(base.slice(1), 16), r = (l >> 16) & 255, gg = (l >> 8) & 255, b = l & 255, v = rnd(-vary, vary);
    g.fillStyle = `rgb(${r + v},${gg + v},${b + v})`; g.fillRect(i * cw, j * ch, cw, ch); }
  g.strokeStyle = joint; g.lineWidth = 2.5; for (let i = 0; i <= cols; i++) { g.beginPath(); g.moveTo(i * cw, 0); g.lineTo(i * cw, h); g.stroke(); } for (let j = 0; j <= rows; j++) { g.beginPath(); g.moveTo(0, j * ch); g.lineTo(w, j * ch); g.stroke(); } }); }

// Baldosa realista: color por pieza con vetas y motas, bordes ligeramente biselados, junta hundida (relieve) y brillo variable.
function tileSet({ base, base2, joint = '#cfc4b4', cols = 2, rows = 2, size = 0.6, vary = 10, speck = 0.12, veins = 0, rough = 0.45 }) {
  const N = 512, cw = N / cols, ch = N / rows, jw = 5;
  const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  const b = document.createElement('canvas'); b.width = b.height = N; const bg = b.getContext('2d');
  const r = document.createElement('canvas'); r.width = r.height = N; const rg = r.getContext('2d');
  const hex = h => { const l = parseInt(h.slice(1), 16); return [(l >> 16) & 255, (l >> 8) & 255, l & 255]; };
  const A = hex(base), B = hex(base2 || base);
  g.fillStyle = joint; g.fillRect(0, 0, N, N); bg.fillStyle = '#303030'; bg.fillRect(0, 0, N, N); rg.fillStyle = '#e6e6e6'; rg.fillRect(0, 0, N, N);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = i * cw + jw / 2, y = j * ch + jw / 2, w = cw - jw, h = ch - jw, k = Math.random(), v = rnd(-vary, vary);
    const col = A.map((a, n) => Math.round(a + (B[n] - a) * k + v));
    const grd = g.createLinearGradient(x, y, x + w, y + h); grd.addColorStop(0, `rgb(${col.map(q => q + 6)})`); grd.addColorStop(1, `rgb(${col.map(q => q - 8)})`);
    g.fillStyle = grd; g.fillRect(x, y, w, h);
    for (let s = 0; s < w * h * speck / 40; s++) { const dv = rnd(-28, 22); g.fillStyle = `rgba(${col.map(q => Math.max(0, q + dv))},${rnd(.25, .6)})`; g.beginPath(); g.arc(x + rnd(0, w), y + rnd(0, h), rnd(.6, 2.2), 0, 7); g.fill(); }
    for (let s = 0; s < veins; s++) { g.strokeStyle = `rgba(255,255,255,${rnd(.08, .2)})`; g.lineWidth = rnd(.6, 1.8); g.beginPath(); let px = x + rnd(0, w), py = y; g.moveTo(px, py);
      for (let q = 0; q < 8; q++) { px += rnd(-w / 6, w / 6); py += h / 8; g.lineTo(Math.min(x + w, Math.max(x, px)), py); } g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2); // bisel
    bg.fillStyle = '#d8d8d8'; bg.fillRect(x, y, w, h); bg.fillStyle = '#c4c4c4'; bg.fillRect(x, y, w, 2); bg.fillRect(x, y, 2, h);
    rg.fillStyle = `rgb(${Math.round(255 * (rough + rnd(-.08, .08)))},0,0)`.replace(/rgb\((\d+),0,0\)/, (m, q) => `rgb(${q},${q},${q})`); rg.fillRect(x, y, w, h);
  }
  const mk = (cv, srgb) => { const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / size, 1 / size); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return { map: mk(c, true), bumpMap: mk(b), bumpScale: 1.6, roughnessMap: mk(r), roughness: 1 };
}
const bump = tex(256, 256, (g, w, h) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { const v = 128 + rnd(-40, 40) | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 3), rnd(1, 3)); } });
bump.colorSpace = THREE.NoColorSpace;
const M = o => new THREE.MeshStandardMaterial({ roughness: .85, metalness: 0, side: THREE.DoubleSide, ...o });
const mats = {
  wall: M({ map: plaster('#e2c38c'), bumpMap: bump, bumpScale: 0.6 }),
  terraceWall: M({ map: plaster('#f1eee7'), bumpMap: bump, bumpScale: 0.6 }),
  coping: M({ map: tileMeters(tiles('#b8603d', 'rgba(230,215,195,.9)', 4, 1, 10), 1.2) }),
  skirting: M({ color: 0xb4623f, roughness: .55 }),
  kitchenTile: M(tileSet({ base: '#f5f5f2', base2: '#eeeeea', joint: '#c9c9c4', cols: 4, rows: 4, size: 0.6, vary: 2, speck: .03, rough: .12 })),
  kitchenBand: M({ color: 0x1d1f21, roughness: .3 }),
  bathWallTile: M(tileSet({ base: '#dac8ae', base2: '#cdb99c', joint: '#a8957b', cols: 3, rows: 4, size: 0.75, vary: 5, speck: .08, veins: 2, rough: .15 })),
  wainscot: M(tileSet({ base: '#b8673f', base2: '#a85a35', joint: '#d6c6ad', cols: 4, rows: 4, size: 0.6, vary: 12, speck: .2, rough: .25 })),
  wainscotBand: M({ color: 0x6e3a22, roughness: .4 }),
  marble: M({ color: 0xe9e6df, roughness: .3 }), alu: M({ color: 0xe8e8e6, metalness: .3, roughness: .35 }),
  doorFrame: M({ color: 0x9c6d42, roughness: .55 }), doorPanel: M({ color: 0x8f6139, roughness: .55 }),
  metal: M({ color: 0x8a8d90, metalness: .8, roughness: .3 }), railBlack: M({ color: 0x1e2022, metalness: .5, roughness: .45 }),
  stoneWall: M({ map: stone, bumpMap: bump, bumpScale: 2 }), stoneDark: M({ color: 0x4d4741 }), downpipe: M({ color: 0xbfbcb6, metalness: .2 }), roof: M({ map: tileRoof, roughness: .9 }), trim: M({ color: 0xf2eadb }),
  stone: M({ map: stone }), door: M({ color: 0x33373a, roughness: .45 }), frosted: M({ color: 0xdfe7ea, roughness: .15 }),
  garage: M({ map: garage, metalness: .45, roughness: .45 }), jamb: M({ color: 0xd6a59a }), lattice: M({ color: 0xc49470 }),
  glassDark: M({ color: 0x26292c }), glass: M({ color: 0x6d8796, roughness: .05, metalness: .5 }), frame: M({ color: 0xdcbb8c }),
  pvc: M({ color: 0xf6f6f2, roughness: .4 }), blind: M({ color: 0xedeeea }), shutter: M({ color: 0x6b3f25 }),
  terraceFloor: M(tileSet({ base: '#b5603a', base2: '#9c4a2c', joint: '#cdbfa8', cols: 2, rows: 2, size: 0.6, vary: 16, speck: .45, rough: .7 })), awning: M({ color: 0x2a9e7a, transparent: true, opacity: .62, depthWrite: false }), rail: M({ color: 0x3a3f44, metalness: .6, roughness: .4 }),
  ground: M({ color: 0xcfcabd }), street: M({ map: asphalt }), streetMain: M({ map: asphalt, color: 0xd8d8d8 }), path: M({ color: 0xc7bfb2 }),
  sidewalk: M({ map: check }),
  wallInt: M({ map: plaster('#f3f0e9'), bumpMap: bump, bumpScale: 0.4 }),
  // suelos como en las fotos: gres claro jaspeado (salón 2, pasillo, cocina), barro cocido rojizo (salón, habitaciones), gres gris en el baño
  floorLight: M(tileSet({ base: '#e6dfd3', base2: '#d9d0c2', joint: '#b9ad9c', cols: 2, rows: 2, size: 0.66, vary: 5, speck: .2, veins: 3, rough: .28 })),
  floorTerracotta: M(tileSet({ base: '#b8603a', base2: '#a04a2b', joint: '#d8cbb6', cols: 2, rows: 2, size: 0.6, vary: 14, speck: .35, rough: .5 })),
  floorBath: M(tileSet({ base: '#cfd0cc', base2: '#bfc1bd', joint: '#9fa19d', cols: 3, rows: 3, size: 0.6, vary: 4, speck: .15, rough: .3 })),
  ceiling: M({ color: 0xf7f6f2 }), lamp: M({ color: 0xffffff, emissive: 0xfff1d6, emissiveIntensity: 1.2 }),
  glassIn: M({ color: 0xa9c6d6, transparent: true, opacity: .35, roughness: .05 }), doorLeaf: M({ color: 0xa8784a, roughness: .6 }),
  step: M({ color: 0xd9d4ca, roughness: .5 }), fireDark: M({ color: 0x1a1612 }), beam: M({ color: 0x6e4a2c, roughness: .8 }),
};

// ---------- escena ----------
const { root, house, levels } = buildHouse(THREE, mats);
const ctx = buildContext(THREE, mats, ROADS);
const interior = buildInteriorP1(THREE, mats);
house.add(interior);
scene.add(ctx, root);
root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

// etiquetas de calles
const streetLabels = [];
for (const l of roadLabels(ROADS)) { const el = document.createElement('div'); el.className = 'street'; el.textContent = l.name; const o = new CSS2DObject(el); o.position.set(l.x, 0.3, l.z); scene.add(o); streetLabels.push(o); }
// etiquetas de estancias
const roomLabels = new THREE.Group(); house.add(roomLabels);
for (const r of P1_ROOMS) {
  const [s, d] = centroid(r.poly), el = document.createElement('div'); el.className = 'room';
  el.innerHTML = `${r.name}<span>≈ ${polyArea(r.poly).toFixed(1).replace('.', ',')} m²</span>`;
  const o = new CSS2DObject(el); o.position.set(s, 3.4 + 1.2, -d); roomLabels.add(o);
}

// ---------- vistas ----------
house.updateMatrixWorld(true);
const W = (s, y, d) => house.localToWorld(new THREE.Vector3(s, y, -d));
const VIEWS = { ext: [W(24, 15, -24), W(5.5, 4.2, 4)], p1: [W(13, 19, -9), W(5.6, 3.4, 5.2)] };
let mode = 'ext';
// ---------- paseo en primera persona ----------
const EYE = 1.62, RADIUS = 0.24, SPEED = 1.5;
const walk = { s: 3, d: 3.9, yaw: 0, pitch: -0.05, keys: new Set(), drag: null };
const hint = document.getElementById('hint'), pad = document.getElementById('pad');
function walkCamera() {
  const y = 3.4 + EYE, cp = Math.cos(walk.pitch);
  camera.position.copy(house.localToWorld(new THREE.Vector3(walk.s, y, -walk.d)));
  camera.lookAt(house.localToWorld(new THREE.Vector3(walk.s + Math.cos(walk.yaw) * cp, y + Math.sin(walk.pitch), -(walk.d + Math.sin(walk.yaw) * cp))));
}
function collide() {
  for (let it = 0; it < 3; it++) for (const c of interior.userData.colliders) {
    const [ax, ay] = c.a, [bx, by] = c.b, dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    const k = Math.max(0, Math.min(1, ((walk.s - ax) * dx + (walk.d - ay) * dy) / L2)), qx = ax + k * dx, qy = ay + k * dy;
    const ex = walk.s - qx, ey = walk.d - qy, dist = Math.hypot(ex, ey), R = RADIUS + c.t / 2;
    if (dist < R && dist > 1e-6) { walk.s = qx + ex / dist * R; walk.d = qy + ey / dist * R; }
  }
}
function walkStep(dt) {
  const K = walk.keys; let f = 0, st = 0, turn = 0;
  if (K.has('w') || K.has('arrowup') || K.has('f')) f += 1;
  if (K.has('s') || K.has('arrowdown') || K.has('b')) f -= 1;
  if (K.has('a')) st -= 1; if (K.has('d')) st += 1;
  if (K.has('arrowleft') || K.has('l')) turn += 1; if (K.has('arrowright') || K.has('r')) turn -= 1;
  if (!f && !st && !turn) return false;
  walk.yaw += turn * 1.8 * dt;
  const cx = Math.cos(walk.yaw), cy = Math.sin(walk.yaw);
  walk.s += (cx * f + cy * st) * SPEED * dt; walk.d += (cy * f - cx * st) * SPEED * dt;
  collide(); return true;
}
addEventListener('keydown', e => { if (mode !== 'walk') return; const k = e.key.toLowerCase(); if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { walk.keys.add(k); e.preventDefault(); } });
addEventListener('keyup', e => walk.keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown', e => { if (mode === 'walk') { walk.drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove', e => { if (mode !== 'walk' || !walk.drag) return;
  walk.yaw -= (e.clientX - walk.drag[0]) * 0.004; walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch - (e.clientY - walk.drag[1]) * 0.004)); walk.drag = [e.clientX, e.clientY]; dirty = 2; });
canvas.addEventListener('pointerup', () => { walk.drag = null; });
for (const b of pad.querySelectorAll('button')) {
  b.addEventListener('pointerdown', e => { e.preventDefault(); walk.keys.add(b.dataset.k); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => walk.keys.delete(b.dataset.k));
}
function setMode(m, instant) {
  const wasWalk = mode === 'walk';
  mode = m;
  const isWalk = m === 'walk', p1 = m === 'p1' || isWalk;
  interior.userData.ceilings.visible = isWalk; interior.userData.lights.visible = isWalk;
  controls.enabled = !isWalk; pad.hidden = !isWalk;
  for (const o of streetLabels) { o.visible = !isWalk; o.element.style.display = isWalk ? 'none' : ''; }
  hint.textContent = isWalk ? 'W A S D o flechas para andar · arrastra para mirar' : 'Arrastra para girar · rueda para acercar';
  document.getElementById('vWalk').setAttribute('aria-pressed', isWalk);
  camera.fov = isWalk ? 68 : 38; camera.updateProjectionMatrix();
  if (isWalk) {
    [walk.s, walk.d] = interior.userData.start; walk.yaw = 0; walk.pitch = -0.05;
    levels.P2.visible = false; levels.CUB.visible = false;
    levels.P1.children.forEach(o => { if (o.userData.slab) o.visible = false; });
    interior.visible = true;
    roomLabels.children.forEach(o => { o.visible = false; o.element.style.display = 'none'; });
    document.getElementById('vExt').setAttribute('aria-pressed', false); document.getElementById('vP1').setAttribute('aria-pressed', false);
    walkCamera(); dirty = 2; return;
  }
  if (wasWalk) instant = false;
  levels.P2.visible = !p1; levels.CUB.visible = !p1;
  levels.P1.children.forEach(o => { if (o.userData.slab) o.visible = !p1; });
  interior.visible = p1;
  roomLabels.children.forEach(o => { o.visible = p1; o.element.style.display = p1 ? '' : 'none'; });
  document.getElementById('vExt').setAttribute('aria-pressed', !p1);
  document.getElementById('vP1').setAttribute('aria-pressed', p1);
  fly(...VIEWS[m], instant);
}
function fly(pos, tgt, instant) {
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  const p0 = camera.position.clone(), t0 = controls.target.clone(), st = performance.now();
  (function step(now) { const k = Math.min(1, (now - st) / 800), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    camera.position.lerpVectors(p0, pos, e); controls.target.lerpVectors(t0, tgt, e); controls.update(); if (k < 1) requestAnimationFrame(step); })(st);
}
document.getElementById('vExt').onclick = () => setMode('ext');
document.getElementById('vP1').onclick = () => setMode('p1');
document.getElementById('vWalk').onclick = () => setMode('walk');
const start = location.hash === '#planta1' ? 'p1' : 'ext';

// sombras de contacto en las esquinas (oclusión ambiental). Si el equipo no puede, se dibuja sin ella.
let composer = null;
try {
  const [{ EffectComposer }, { RenderPass }, { GTAOPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/GTAOPass.js'), import('three/addons/postprocessing/OutputPass.js')]);
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  ao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.2, scale: 1.1, samples: 12 });
  ao.blendIntensity = 0.85; composer.addPass(ao);
  composer.addPass(new OutputPass());
} catch (e) { composer = null; }

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer?.setSize(w, h); lr.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
setMode(start, true);
document.getElementById('loading').remove();
// solo se redibuja cuando algo cambia: menos consumo y sin tirones
let dirty = 2; controls.addEventListener('change', () => { dirty = 2; });
const markDirty = () => { dirty = 2; };
document.getElementById('vExt').addEventListener('click', markDirty); document.getElementById('vP1').addEventListener('click', markDirty); addEventListener('resize', markDirty);
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'walk') { if (walkStep(dt) || walk.drag) dirty = 2; walkCamera(); }
  else controls.update();
  if (dirty <= 0) return; dirty--;
  if (composer) composer.render(); else renderer.render(scene, camera);
  lr.render(scene, camera);
});
</script>
